[terminal]
vt = 1
switch = true

[general]
source_profile = true

# One-shot physical-compositor keyboard comparison. The live config is restored
# to Suno immediately after greetd starts this authenticated initial session.
[initial_session]
command = "/usr/local/bin/Suno-wkeys-direct-session"
user = "Suno"

[default_session]
command = "agreety --cmd /usr/local/bin/Suno-shell-session"
user = "greetd"
