[terminal]
vt = 1
switch = true

[general]
source_profile = true

# One-shot physical-compositor Lomiri Keyboard comparison. The live config is
# restored to Suno immediately after greetd starts this authenticated session.
[initial_session]
command = "/usr/local/bin/Suno-lomiri-direct-session"
user = "Suno"

[default_session]
command = "agreety --cmd /usr/local/bin/Suno-shell-session"
user = "greetd"
