.8" width="6" height="29.5" fill="#fff"/><rect x="1015.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1015.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1103.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1103.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1147.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1147.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1191.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1191.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1235.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1235.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1323.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1323.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1367.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1367.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1411.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1411.0" y="632.8" width="6" height="29.5" fill="#fff"/><rect x="1455.0" y="361.7" width="6" height="29.5" fill="#fff"/><rect x="1455.0" y="632.8" width="6" height="29.5" fill="#fff"/></g>
<rect x="82" y="82" width="860" height="860" fill="url(#vig)"/>
<rect x="82" y="82" width="860" height="860" fill="url(#light)"/>
</g>
<rect x="82" y="82" width="860" height="860" rx="202" fill="none" stroke="url(#rim)" stroke-width="8" clip-path="url(#pl)"/>
</svg>
