# Suno operating system updates (ADR-030 section 5). Signed commits and a
# signed summary are required; the only trusted key is the Suno OS Release key.
# The repository URL is in the root-only mirror list /etc/Suno/update-mirrorlist
# (https://dl.simplyluma.com/os/repo as shipped). Preview enrollment (beta,
# nightly) rewrites only that list with the device's credential path, so this
# world-readable file never changes and never holds a credential
# (docs/os/Suno-update.md). Nothing adds a second definition of the remote.
[remote "Suno"]
url=mirrorlist=file:///etc/Suno/update-mirrorlist
gpg-verify=true
gpg-verify-summary=true
gpgkeypath=/etc/pki/ostree/Suno-release.gpg
collection-id=org.projectSuno.OS
