# SPDX-License-Identifier: Apache-2.0
{
  "id": "org.projectSuno.Displays",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "org.projectSuno.Displays",
  "finish-args": [
    "--metadata=X-Suno=app-data-schema=displays-v1",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--talk-name=org.gnome.Mutter.DisplayConfig",
    "--talk-name=org.projectSuno.AppData1",
    "--metadata=X-Suno=min-host-installer=57",
    "--filesystem=xdg-config/monitors.xml:ro",
    "--talk-name=org.gnome.Settings"
  ],
  "modules": [
    {
      "name": "displays",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/Suno-displays/Suno_displays /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "printf '#!/bin/sh\\nexec python3 -m Suno_displays \"$@\"\\n' > /app/bin/org.projectSuno.Displays-real",
        "chmod 755 /app/bin/org.projectSuno.Displays-real",
        "printf '#!/bin/sh\\nexec python3 -m Suno_appkit.migration_startup org.projectSuno.Displays-real \"$@\"\\n' > /app/bin/org.projectSuno.Displays",
        "chmod 755 /app/bin/org.projectSuno.Displays",
        "install -Dm644 src/Suno-displays/data/org.projectSuno.Displays.desktop /app/share/applications/org.projectSuno.Displays.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Displays.svg",
        "sed -i 's/^Icon=.*/Icon=org.projectSuno.Displays/' /app/share/applications/org.projectSuno.Displays.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Displays.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Displays/LICENSE.md",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectSuno.Displays\\nExec=/app/bin/org.projectSuno.Displays\\n' > /app/share/dbus-1/services/org.projectSuno.Displays.service",
        "install -d /app/share/Suno-app-media",
        "install -m644 depot-media/*.png /app/share/Suno-app-media/"
      ]
    }
  ],
  "appstream-compose": false
}
