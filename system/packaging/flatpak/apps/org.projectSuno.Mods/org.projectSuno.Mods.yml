# SPDX-License-Identifier: Apache-2.0
appstream-compose: false
id: org.projectSuno.Mods
runtime: org.projectSuno.Platform
runtime-version: '44'
sdk: org.projectSuno.Sdk
command: Suno-mods
finish-args:
  - --talk-name=org.projectSuno.ShellState1
  - --metadata=X-Suno=min-host-mods=24
  - --metadata=X-Suno=min-host-installer=57
  - --metadata=X-Suno=app-data-schema=mods-host-v1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.projectSuno.ModProfiles1
  - --system-talk-name=org.projectSuno.ModTransactions1
modules:
  - name: mods-ui
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.14/site-packages /app/bin
      - cp -a src/Suno-mods/Suno_mods /app/lib/python3.14/site-packages/
      - python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages
      - printf '#!/bin/sh\nexec python3 -m Suno_mods.gallery "$@"\n' > /app/bin/Suno-mods
      - chmod 755 /app/bin/Suno-mods
      - install -Dm644 src/Suno-mods/data/org.projectSuno.Mods.desktop /app/share/applications/org.projectSuno.Mods.desktop
      - sed -i 's/^Icon=.*/Icon=org.projectSuno.Mods/' /app/share/applications/org.projectSuno.Mods.desktop
      - install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Mods.svg
      - install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Mods.metainfo.xml
      - install -Dm644 depot-media/8471041c907fc2e92802073f2346df34fb324f2ebcb121fb9a06aeb4f60fa44a.png /app/share/Suno-app-media/8471041c907fc2e92802073f2346df34fb324f2ebcb121fb9a06aeb4f60fa44a.png
      - install -Dm644 depot-media/ad04d1bc6129e121170e72247768d275f6db34ac595ad6d4fc2bc1b29465bb6c.png /app/share/Suno-app-media/ad04d1bc6129e121170e72247768d275f6db34ac595ad6d4fc2bc1b29465bb6c.png
      - install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Mods/LICENSE.md
