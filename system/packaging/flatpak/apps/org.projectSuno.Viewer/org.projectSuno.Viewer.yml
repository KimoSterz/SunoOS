# Sealed sources required by the canonical first-party producer.
{
  "appstream-compose": false,
  "id": "org.projectSuno.Viewer",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "Suno-viewer",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--metadata=X-Suno=min-host-installer=62",
    "--metadata=X-Suno=app-data-schema=viewer-v1",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--socket=pulseaudio",
    "--env=SUNO_VIEWER_STYLE_PATH=/app/share/Suno-viewer/viewer.css",
    "--env=SUNO_VIEWER_ICON_PATH=/app/share/Suno-viewer/icons",
    "--env=SUNO_LEAF_DATA_DIR=/app/share/leaf",
    "--talk-name=org.projectSuno.ApplicationDirectory1",
    "--talk-name=org.projectSuno.AppData1"
  ],
  "modules": [
    {
      "name": "viewer",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/Suno-viewer/Suno_viewer /app/lib/python3.14/site-packages/",
        "install -Dm755 src/Suno-viewer/bin/Suno-viewer /app/bin/Suno-viewer-real",
        "printf '#!/bin/sh\\nexec python3 -m Suno_appkit.migration_startup Suno-viewer-real \"$@\"\\n' > /app/bin/Suno-viewer",
        "chmod 755 /app/bin/Suno-viewer",
        "install -Dm644 src/Suno-viewer/data/org.projectSuno.Viewer.desktop /app/share/applications/org.projectSuno.Viewer.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Viewer.svg",
        "sed -i 's/^Icon=.*/Icon=org.projectSuno.Viewer/' /app/share/applications/org.projectSuno.Viewer.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Viewer.metainfo.xml",
        "install -Dm644 depot-media/b9f82c293919cf6768328f95e473fc9ea74c0c738d5b29e584cfe73f0a76c634.png /app/share/Suno-app-media/b9f82c293919cf6768328f95e473fc9ea74c0c738d5b29e584cfe73f0a76c634.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Viewer/LICENSE.md",
        "install -Dm644 src/Suno-viewer/viewer.css /app/share/Suno-viewer/viewer.css",
        "cp -a src/Suno-leaf/Suno_leaf /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "install -d /app/share/leaf",
        "cp -a src/Suno-leaf/data/. /app/share/leaf/",
        "install -d /app/share/Suno-viewer/icons",
        "cp -a src/Suno-viewer/data/icons/. /app/share/Suno-viewer/icons/",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectSuno.Viewer\\nExec=/app/bin/Suno-viewer\\n' > /app/share/dbus-1/services/org.projectSuno.Viewer.service"
      ]
    }
  ]
}
