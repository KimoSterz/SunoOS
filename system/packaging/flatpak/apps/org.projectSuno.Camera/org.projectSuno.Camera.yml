# SPDX-License-Identifier: Apache-2.0
{
  "appstream-compose": false,
  "id": "org.projectSuno.Camera",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "prairie-camera",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--env=SUNO_CAMERA_STYLE_PATH=/app/share/prairie-core/camera.css",
    "--metadata=X-Suno=app-data-schema=camera-v1",
    "--metadata=X-Suno=min-host-installer=60",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectSuno.AppData1",
    "--socket=pulseaudio",
    "--filesystem=xdg-data/Suno-photos:create",
    "--filesystem=xdg-pictures:create",
    "--filesystem=xdg-config/user-dirs.dirs:ro",
    "--talk-name=org.projectSuno.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "camera",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a --no-preserve=ownership src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "install -Dm755 src/prairie-core/bin/prairie-camera /app/bin/prairie-camera-real",
        "printf '#!/bin/sh\\nexec python3 -m Suno_appkit.migration_startup prairie-camera-real \"$@\"\\n' > /app/bin/prairie-camera",
        "chmod 755 /app/bin/prairie-camera",
        "install -Dm644 src/prairie-core/data/org.projectSuno.Camera.desktop /app/share/applications/org.projectSuno.Camera.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Camera.svg",
        "cp -a --no-preserve=ownership src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Camera.metainfo.xml",
        "install -Dm644 depot-media/e43ddbf5a430a32d6795ceaf8a464da64db4550a9a16ab9d04e69d2f119cb4e7.png /app/share/Suno-app-media/e43ddbf5a430a32d6795ceaf8a464da64db4550a9a16ab9d04e69d2f119cb4e7.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Camera/LICENSE.md"
      ]
    }
  ]
}
