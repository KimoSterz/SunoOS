{
  "appstream-compose": false,
  "id": "org.projectSuno.Messages",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "prairie-messages",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--env=SUNO_MESSAGES_STYLE_PATH=/app/share/prairie-core/messages.css",
    "--env=PRAIRIE_STYLE_PATH=/app/share/prairie-core/prairie.css",
    "--metadata=X-Suno=app-data-schema=messages-v1",
    "--metadata=X-Suno=min-host-installer=66",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectSuno.AppData1",
    "--talk-name=org.projectSuno.Connect1",
    "--talk-name=org.projectSuno.Background1",
    "--metadata=X-Suno=min-host-core=99",
    "--metadata=X-Suno=min-host-background=5",
    "--talk-name=org.projectSuno.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "messages",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a --no-preserve=ownership src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "cp -a --no-preserve=ownership src/prairie-core/prairie_ui /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "install -Dm755 src/prairie-core/bin/prairie-messages /app/bin/prairie-messages-real",
        "printf '#!/bin/sh\\nexec python3 -m Suno_appkit.migration_startup prairie-messages-real \"$@\"\\n' > /app/bin/prairie-messages",
        "chmod 755 /app/bin/prairie-messages",
        "install -Dm644 src/prairie-core/data/org.projectSuno.Messages.desktop /app/share/applications/org.projectSuno.Messages.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Messages.svg",
        "cp -a --no-preserve=ownership src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Messages.metainfo.xml",
        "install -Dm644 depot-media/582a2febf98c585bc088781c442e5376a354b5ca924f254d3bf244ade38a0b1c.png /app/share/Suno-app-media/582a2febf98c585bc088781c442e5376a354b5ca924f254d3bf244ade38a0b1c.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Messages/LICENSE.md"
      ]
    }
  ]
}
