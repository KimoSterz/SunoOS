{
  "id": "org.projectSuno.Phone",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "prairie-phone",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--env=SUNO_PHONE_STYLE_PATH=/app/share/prairie-core/phone.css",
    "--metadata=X-Suno=min-host-core=97",
    "--metadata=X-Suno=app-data-schema=phone-v1",
    "--metadata=X-Suno=min-host-installer=64",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectSuno.AppData1",
    "--socket=pulseaudio",
    "--system-talk-name=org.freedesktop.ModemManager1",
    "--system-talk-name=net.catcrafts.IMS1",
    "--system-talk-name=org.projectSuno.AudioRoute1",
    "--filesystem=xdg-data/prairie/phone:create",
    "--filesystem=xdg-data/Suno/phone:create",
    "--talk-name=org.projectSuno.Connect1",
    "--talk-name=org.gnome.evolution.dataserver.Sources5",
    "--talk-name=org.gnome.evolution.dataserver.AddressBook10",
    "--metadata=X-Suno=min-host-continuity=63",
    "--talk-name=org.projectSuno.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "phone",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a --no-preserve=ownership src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -d /app/lib/python3.14/site-packages/Suno_continuity",
        "install -m644 src/Suno-continuity/Suno_continuity/__init__.py src/Suno-continuity/Suno_continuity/phone_contract.py src/Suno-continuity/Suno_continuity/call_provider.py /app/lib/python3.14/site-packages/Suno_continuity/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "install -Dm755 src/prairie-core/bin/prairie-phone /app/bin/prairie-phone-real",
        "printf '#!/bin/sh\\nexec python3 -m Suno_appkit.migration_startup prairie-phone-real \"$@\"\\n' > /app/bin/prairie-phone",
        "chmod 755 /app/bin/prairie-phone",
        "install -Dm644 src/prairie-core/data/org.projectSuno.Phone.desktop /app/share/applications/org.projectSuno.Phone.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Phone.svg",
        "cp -a --no-preserve=ownership src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Phone.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Phone/LICENSE.md",
        "install -Dm644 depot-media/fa2bce9454417e98358758c20aac625d6c4d7dea7284486b85aa4e365e58cffa.png /app/share/Suno-app-media/fa2bce9454417e98358758c20aac625d6c4d7dea7284486b85aa4e365e58cffa.png"
      ]
    }
  ],
  "appstream-compose": false
}
