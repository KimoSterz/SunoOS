{
  "id": "io.Suno.Monitor",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "io.Suno.Monitor",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--metadata=X-Suno=app-data-schema=monitor-v1",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--talk-name=org.projectSuno.MonitorHost1",
    "--env=SUNO_MONITOR_STYLE_PATH=/app/share/Suno-monitor/monitor.css",
    "--metadata=X-Suno=min-host-monitor=17",
    "--metadata=X-Suno=min-host-installer=57"
  ],
  "modules": [
    {
      "name": "monitor",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/Suno-monitor/Suno_monitor /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "printf '#!/bin/sh\\nexec python3 -m Suno_monitor.application \"$@\"\\n' > /app/bin/io.Suno.Monitor",
        "chmod 755 /app/bin/io.Suno.Monitor",
        "install -Dm644 src/Suno-monitor/data/io.Suno.Monitor.desktop /app/share/applications/io.Suno.Monitor.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/io.Suno.Monitor.svg",
        "sed -i 's/^Icon=.*/Icon=io.Suno.Monitor/' /app/share/applications/io.Suno.Monitor.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/io.Suno.Monitor.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/io.Suno.Monitor/LICENSE.md",
        "install -d /app/share/Suno-monitor",
        "cp -a src/Suno-monitor/data/. /app/share/Suno-monitor/",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=io.Suno.Monitor\\nExec=/app/bin/io.Suno.Monitor\\n' > /app/share/dbus-1/services/io.Suno.Monitor.service",
        "install -Dm644 depot-media/0b9c9c9c6c7fbff3596edf45195a7f0d4e749053e878aa1f1eaddc3f2a8efaa0.png /app/share/Suno-app-media/0b9c9c9c6c7fbff3596edf45195a7f0d4e749053e878aa1f1eaddc3f2a8efaa0.png"
      ]
    }
  ],
  "appstream-compose": false
}
