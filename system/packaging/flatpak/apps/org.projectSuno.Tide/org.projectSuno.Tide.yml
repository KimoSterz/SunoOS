# This template cannot build until a source archive has been sealed.
id: org.projectSuno.Tide
runtime: org.projectSuno.Platform
runtime-version: '44'
sdk: org.projectSuno.Sdk
command: org.projectSuno.Tide
appstream-compose: false
finish-args:
  - --talk-name=org.projectSuno.Shell.Keyboard
  - --talk-name=org.projectSuno.Shell.Remote
  - --talk-name=org.projectSuno.ShellState1
  - --talk-name=org.projectSuno.ApplicationDirectory1
  - --metadata=X-Suno=min-host-installer=60
  - --metadata=X-Suno=app-data-schema=tide-v1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.projectSuno.AppData1
  - --own-name=org.mpris.MediaPlayer2.Tide
modules:
  - name: tide
    buildsystem: meson
    subdir: src/Suno-tide
    config-opts:
      - --buildtype=release
    post-install:
      - mv /app/bin/org.projectSuno.Tide /app/bin/Suno-tide-real
      - printf '#!/bin/sh\nexec python3 -m Suno_appkit.migration_startup Suno-tide-real "$@"\n' > /app/bin/org.projectSuno.Tide
      - chmod 755 /app/bin/org.projectSuno.Tide
      - install -d /app/share/Suno-tv && mv /app/share/icons/hicolor/scalable/apps/org.projectSuno.Tide-tv.svg /app/share/Suno-tv/
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/depot.metainfo.xml" /app/share/metainfo/org.projectSuno.Tide.metainfo.xml
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/depot-media/54e8384883b98ef609ad5a5361c7981928becd95ced88bc5080946a6c8d85611.png" /app/share/Suno-app-media/54e8384883b98ef609ad5a5361c7981928becd95ced88bc5080946a6c8d85611.png
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/LICENSE.md" /app/share/licenses/org.projectSuno.Tide/LICENSE.md
