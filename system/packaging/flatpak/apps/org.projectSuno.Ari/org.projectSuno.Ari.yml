{
  "id": "org.projectSuno.Ari",
  "runtime": "org.projectSuno.Platform",
  "runtime-version": "44",
  "sdk": "org.projectSuno.Sdk",
  "command": "org.projectSuno.Ari",
  "finish-args": [
    "--talk-name=org.projectSuno.ShellState1",
    "--metadata=X-Suno=app-data-schema=ari-host-v1",
    "--metadata=X-Suno=min-host-installer=57",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--talk-name=org.projectSuno.Ari1",
    "--metadata=X-Suno=min-host-ari=21",
    "--talk-name=org.projectSuno.ShellState1"
  ],
  "modules": [
    {
      "name": "ari-ui",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a --no-preserve=ownership src/Suno-ari/ari_ui /app/lib/python3.14/site-packages/",
        "python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages",
        "printf '#!/bin/sh\\nexec python3 -m ari_ui.app \"$@\"\\n' > /app/bin/org.projectSuno.Ari",
        "chmod 755 /app/bin/org.projectSuno.Ari",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectSuno.Ari\\nExec=/app/bin/org.projectSuno.Ari\\n' > /app/share/dbus-1/services/org.projectSuno.Ari.service",
        "install -Dm644 src/Suno-ari/data/org.projectSuno.Ari.desktop /app/share/applications/org.projectSuno.Ari.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Ari.svg",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Ari.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Ari/LICENSE.md",
        "install -Dm644 depot-media/eb4536550cc8d32ed547aa760a8a122ad3e14b472a75ba31455286025ec24592.png /app/share/Suno-app-media/eb4536550cc8d32ed547aa760a8a122ad3e14b472a75ba31455286025ec24592.png"
      ]
    }
  ],
  "appstream-compose": false
}
