# SPDX-License-Identifier: Apache-2.0
id: org.projectSuno.Depot
runtime: org.projectSuno.Platform
runtime-version: '44'
sdk: org.projectSuno.Sdk
command: Suno-depot
appstream-compose: false
finish-args:
  - --talk-name=org.projectSuno.Shell.Keyboard
  - --talk-name=org.projectSuno.Shell.Remote
  - --talk-name=org.projectSuno.ShellState1
  - --metadata=X-Suno=min-host-installer=68
  - --metadata=X-Suno=app-data-schema=depot-v1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --env=SUNO_DEPOT_STYLE_PATH=/app/share/Suno/depot/depot.css
  - --talk-name=org.projectSuno.DepotHost1
  - --talk-name=org.projectSuno.AppData1
  - --talk-name=org.gnome.SessionManager
  - --system-talk-name=org.projectSuno.Update1
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.UPower.PowerProfiles
modules:
  - name: depot-ui
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.14/site-packages /app/bin
      - cp -a --no-preserve=ownership src/Suno-depot/Suno_depot src/Suno-installer/Suno_installer /app/lib/python3.14/site-packages/
      - python3 -m compileall -q -f -j0 --invalidation-mode checked-hash /app/lib/python3.14/site-packages
      - printf '#!/bin/sh\nexec python3 -m Suno_depot.window "$@"\n' > /app/bin/Suno-depot-real
      - printf '#!/bin/sh\nexec python3 -m Suno_appkit.migration_startup Suno-depot-real "$@"\n' > /app/bin/Suno-depot
      - chmod 755 /app/bin/Suno-depot /app/bin/Suno-depot-real
      - install -Dm644 src/Suno-depot/data/depot.css /app/share/Suno/depot/depot.css
      - install -Dm644 src/Suno-depot/data/depot-redesign.css /app/share/Suno/depot/depot-redesign.css
      - install -Dm644 src/Suno-depot/data/Suno-logo-white.svg /app/share/Suno/depot/Suno-logo-white.svg
      - install -d /app/share/Suno/depot/screenshots /app/share/Suno/depot/photos /app/share/Suno/depot/rooms
      - install -m644 src/Suno-depot/data/screenshots/*.webp /app/share/Suno/depot/screenshots/
      - install -m644 src/Suno-depot/data/photos/*.webp /app/share/Suno/depot/photos/
      - install -m644 src/Suno-depot/data/rooms/*.webp /app/share/Suno/depot/rooms/
      - install -Dm644 src/Suno-depot/data/icons/hicolor/scalable/actions/SunoUI-code-xml-symbolic.svg /app/share/Suno/depot/icons/hicolor/scalable/actions/SunoUI-code-xml-symbolic.svg
      - install -Dm644 src/Suno-depot/data/org.projectSuno.Depot.desktop /app/share/applications/org.projectSuno.Depot.desktop
      - install -Dm644 src/Suno-depot/data/org.projectSuno.Depot.service /app/share/dbus-1/services/org.projectSuno.Depot.service
      - install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectSuno.Depot.svg
      - install -Dm644 src/Suno-depot/data/icons/hicolor/scalable/apps/org.projectSuno.Depot-tv.svg /app/share/Suno-tv/org.projectSuno.Depot-tv.svg
      - install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectSuno.Depot.metainfo.xml
      - install -Dm644 LICENSE.md /app/share/licenses/org.projectSuno.Depot/LICENSE.md
      - install -Dm644 depot-media/cc3af148aaa7857e61833f095effb5441297f05eab2f5733f3c912f5b561af56.png /app/share/Suno-app-media/cc3af148aaa7857e61833f095effb5441297f05eab2f5733f3c912f5b561af56.png
