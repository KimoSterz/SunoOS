[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Suno-tester"
version = "0.7.9"
description = "Try Suno: SunoUI previews and development for Desktop, Tablet and Mobile"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
Suno-tester = "Suno_tester.__main__:main"

[tool.setuptools.packages.find]
include = ["Suno_tester*"]

[tool.setuptools.package-data]
Suno_tester = ["tester.css", "io.Suno.Tester.svg"]

[tool.setuptools.data-files]
"share/applications" = ["io.Suno.Tester.desktop"]
"share/icons/hicolor/scalable/apps" = ["Suno_tester/io.Suno.Tester.svg"]

"share/doc/Suno-tester" = ["THIRD-PARTY.md"]
