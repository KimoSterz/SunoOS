# SPDX-License-Identifier: Apache-2.0
#
# What an installed application may do with sound.
#
# Installed as /usr/share/wireplumber/wireplumber.conf.d/70-Suno-application-access.conf
# by Suno-application-installer; see 60-Suno-application-socket.conf.
#
# scripts/Suno/application-sound.lua sets the permissions of every client of
# an installed application (its own PulseAudio server's clients and the
# application socket's) and holds every recording of an installed
# application or a Flatpak to the microphone permission in the permission
# store (devices / microphone). Playback is not changed.
#
# The rules live in the script and not in access.rules: WirePlumber 0.5.14
# reads only default_permissions from access.rules, which cannot depend on
# the application or change while it runs.

wireplumber.components = [
  {
    name = Suno/application-sound.lua, type = script/lua
    provides = Suno.script.application-sound
    wants = [ support.portal-permissionstore ]
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.linking.standard" }
    ]
    actions = {
      merge = {
        wants = [ Suno.script.application-sound ]
      }
    }
  }
]
