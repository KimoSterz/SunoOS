# Phone's background agent (ADR-033): calls from the phone chosen for calls in
# Suno Connect ring while Phone is closed.
# Installed as /usr/share/Suno/background/org.projectSuno.Phone.toml for Suno-background.
schema_version = "0.2"

[application]
id = "org.projectSuno.Phone"
name = "Phone"

[background]
agent = "org.projectSuno.Phone.Agent"
exec = "prairie-phone --agent"
category = "communication"
wake = ["login", "network", "resume"]
publishes = ["call-state", "missed-calls", "badge", "live-extension:org.projectSuno.Phone.Call"]
