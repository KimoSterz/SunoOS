# SPDX-License-Identifier: MPL-2.0
#
# Project Suno sound output policy for WirePlumber 0.5.
#
# Installed as /usr/share/wireplumber/wireplumber.conf.d/60-Suno-audio-policy.conf
# by Suno-audio-policy. It adds hooks to the stock default-node selection and
# declares one retired setting. It changes no stock
# setting and does not replace any upstream script, so a person's own
# fragments in /etc/wireplumber or ~/.config/wireplumber keep working.
#
# To turn the Suno rules off for one account, add a fragment in
# ~/.config/wireplumber/wireplumber.conf.d/ with:
#   wireplumber.profiles = { main = { Suno.hooks.default-nodes.output-policy = disabled } }
# and, for the per-app rules (Suno/app-audio.lua):
#   wireplumber.profiles = { main = { Suno.app-audio = disabled } }

wireplumber.settings.schema = {
  # Retired with the new-device prompts (Suno-audio-policy 1.Suno.3). Still
  # declared so Suno-audio-devices can remove values saved by 1.Suno.1-2.
  Suno.audio.manual-only-outputs = {
    name = "Retired: outputs used only when chosen"
    description = "No longer read. Suno-audio-devices removes the value saved by earlier versions"
    type = "array"
    default = []
  }
}

wireplumber.components = [
  {
    name = Suno/output-policy.lua, type = script/lua
    provides = Suno.hooks.default-nodes.output-policy
    requires = [ metadata.default ]
  }
  # Per-app volume, mute and output remembered per app, capture sessions for
  # the audio capture portal, and the guard that keeps portal-restricted
  # PipeWire remotes away from devices they were not granted.
  {
    name = Suno/app-audio.lua, type = script/lua
    provides = Suno.app-audio
    requires = [ metadata.default, api.mixer ]
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.default-nodes" }
    ]
    actions = {
      merge = {
        wants = [ Suno.hooks.default-nodes.output-policy ]
      }
    }
  }
  {
    matches = [
      { provides = "policy.linking.standard" }
    ]
    actions = {
      merge = {
        wants = [ Suno.app-audio ]
      }
    }
  }
]

