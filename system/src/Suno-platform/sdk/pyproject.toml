[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "Suno-developer-platform"
version = "0.1.0"
description = "Developer tools for adaptive, semantic Suno applications"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
Suno = "Suno_sdk.cli:main"
Suno-sdk = "Suno_sdk.cli:main"

[tool.setuptools.package-data]
Suno_sdk = ["templates/**/*"]
