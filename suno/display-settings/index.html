<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunoOS — Ustawienia › Ekran › Night Light</title>
<link rel="stylesheet" href="../../simframe/fonts/figtree/figtree.css">
<style>
  :root {
    --bg: #17181c;
    --card: #26272d;
    --card-2: #2f3038;
    --line: #3a3b44;
    --text: #f2f3f7;
    --muted: #9a9ba6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 20% 0%, #201c2e 0%, var(--bg) 55%);
    font-family: Figtree, system-ui, -apple-system, sans-serif;
    color: var(--text);
  }
  .panel {
    width: min(660px, 94vw);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px 22px 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 2px 2px 14px; }
  .crumbs .back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 7px; text-decoration: none;
    color: var(--text); background: var(--card-2); border: 1px solid var(--line);
  }
  .crumbs .back:hover { background: #35363f; }
  .crumbs b { color: var(--text); font-weight: 600; }
  .crumbs .sep { opacity: .5; }
  h1 { font-size: 17px; font-weight: 700; margin: 2px 4px 2px; letter-spacing: .2px; }
  .sub { font-size: 12.5px; color: var(--muted); margin: 0 4px 16px; }

  .card {
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px 10px; margin-bottom: 12px;
  }
  .row-head { display: flex; align-items: baseline; gap: 10px; }
  .row-head b { font-size: 14px; font-weight: 600; }
  .row-head .val { margin-left: auto; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-head .val b { color: var(--text); font-weight: 600; }

  .slider-wrap { position: relative; padding: 10px 2px 44px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 999px; outline: none; margin: 0;
    background: linear-gradient(90deg, #57a6ff 0%, #7db4ff 35%, #ffcf8a 70%, #ffab40 100%);
    cursor: ew-resize;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.18);
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    cursor: ew-resize;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.18);
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    cursor: ew-resize;
  }
  input[type="range"]:disabled { opacity: .45; cursor: default; }

  .grooves { position: absolute; left: 2px; right: 2px; top: 16px; height: 30px; }
  .groove { position: absolute; transform: translateX(-50%); text-align: center; }
  .groove i {
    display: block; width: 3px; height: 9px; border-radius: 2px;
    background: #17181d;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.65), 0 1px 0 0 rgba(255,255,255,.09);
    margin: 0 auto;
  }
  .groove em {
    display: block; font-style: normal; font-size: 9.5px; line-height: 1;
    color: var(--muted); white-space: nowrap; margin-top: 4px;
    transform: translateX(-50%); position: relative; left: 50%;
    font-variant-numeric: tabular-nums;
  }
  .groove.on em { color: var(--text); font-weight: 600; }
  .groove.on i { box-shadow: inset 0 1px 1px rgba(0,0,0,.65), 0 1px 0 0 rgba(255,255,255,.18); }

  .preview {
    margin-top: 2px; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); position: relative; height: 150px;
    background:
      radial-gradient(90% 140% at 15% 10%, #7f5cff 0%, transparent 60%),
      radial-gradient(110% 150% at 85% 15%, #ff5c9e 0%, transparent 55%),
      radial-gradient(120% 160% at 50% 110%, #3ec7ff 0%, transparent 60%),
      #101018;
  }
  .preview .tint { position: absolute; inset: 0; background: var(--tint, #fff);
    opacity: var(--tint-op, .12); mix-blend-mode: overlay; transition: opacity .15s; }
  .preview .chrome {
    position: absolute; left: 10%; right: 10%; bottom: 12px; height: 34px;
    border-radius: 12px; background: rgba(20,21,26,.75);
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .preview .chrome span { width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,.25); }
  .preview .chrome span:nth-child(3) { background: rgba(255,255,255,.75); }

  .note { font-size: 11.5px; color: var(--muted); margin: 10px 6px 0; }
</style>
</head>
<body>
  <section class="panel">
    <nav class="crumbs">
      <a class="back" href="#" title="Ustawienia" aria-label="Powrót do Ustawień">‹</a>
      <span>Ustawienia</span><span class="sep">›</span>
      <span>Ekran</span><span class="sep">›</span>
      <b>Night Light</b>
    </nav>
    <h1>Night Light</h1>
    <p class="sub">Od zachodu do wschodu słońca kontroluje barwę Twojego ekranu.</p>

    <div class="card" id="card-kelvin">
      <div class="row-head">
        <b>Kolor ekranu</b>
        <span class="val"><b id="k-val">5000</b> K · <span id="k-name">Światło dzienne</span></span>
      </div>
      <div class="slider-wrap">
        <input type="range" id="kelvin" min="2000" max="8000" step="1000" value="5000" aria-label="Temperatura barwowa ekranu">
        <div class="grooves" id="grooves" aria-hidden="true"></div>
      </div>
    </div>

    <div class="preview" id="prev">
      <div class="tint" id="tint"></div>
      <div class="chrome"><span></span><span></span><span></span></div>
    </div>
    <p class="note">Podgląd obrazu z zastosowaną barwą. Przystanki co 1000 K, od 2000 do 8000 K.</p>
  </section>

<script>
(() => {
  'use strict';
  const MIN = 2000, MAX = 8000, STEP = 1000, DEF = 5000;
  const NAMES = {
    2000: 'Świeca', 3000: 'Żarówka', 4000: 'Ciepła', 5000: 'Światło dzienne',
    6000: 'Zachmurzenie', 7000: 'Chłodna', 8000: 'Zimna'
  };

  const kelvinToRgb = k => {
    const t = k / 100;
    let r, g, b;
    if (t <= 66) {
      r = 255;
      g = 99.4708025861 * Math.log(t) - 161.1195681661;
      b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    } else {
      r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
      g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
      b = 255;
    }
    const cl = v => Math.max(0, Math.min(255, Math.round(v)));
    return [cl(r), cl(g), cl(b)];
  };
  const rgbCss = rgb => `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;

  const slider = document.getElementById('kelvin');
  const kVal = document.getElementById('k-val');
  const kName = document.getElementById('k-name');
  const tint = document.getElementById('tint');
  const grooves = document.getElementById('grooves');

  for (let k = MIN; k <= MAX; k += STEP) {
    const g = document.createElement('span');
    g.className = 'groove' + (k === DEF ? ' on' : '');
    g.style.left = (((k - MIN) / (MAX - MIN)) * 100) + '%';
    g.innerHTML = `<i></i><em>${k}</em>`;
    grooves.appendChild(g);
  }

  const render = () => {
    const k = Number(slider.value), css = rgbCss(kelvinToRgb(k));
    const off = Math.abs(k - DEF) / 1000;
    kVal.textContent = k;
    kName.textContent = NAMES[k] || '';
    tint.style.setProperty('--tint', css);
    tint.style.setProperty('--tint-op', k === DEF ? 0.06 : 0.12 + 0.05 * off);
    slider.setAttribute('aria-valuetext', `${k} kelwin, ${NAMES[k] || ''}`);
    [...grooves.children].forEach((g, i) => {
      g.classList.toggle('on', MIN + i * STEP === k);
    });
  };
  slider.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
