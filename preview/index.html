<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunoOS — podgląd makiety</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  .frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .fallback { position: fixed; inset: auto 0 0 0; padding: 8px 16px; color: #eee;
              font: 13px/1.5 system-ui, sans-serif; background: #000; text-align: center; }
  .fallback a { color: #9ecbff; }
  @media (min-width: 700px) { .fallback { display: none; } }
  .module { position: fixed; top: 10px; right: 12px; z-index: 2; }
  .module a { display: inline-block; padding: 6px 12px; border-radius: 999px;
              background: rgba(0,0,0,.55); color: #eee; text-decoration: none;
              font: 12px/1.4 system-ui, sans-serif; border: 1px solid rgba(255,255,255,.18); }
  .module a:hover { background: rgba(0,0,0,.75); }
  #status { position: fixed; inset: 0; display: grid; place-items: center;
            color: #9aa; font: 14px/1.6 system-ui, sans-serif; z-index: 1; }
  #status.err { color: #ffb4a6; text-align: center; padding: 0 24px; }
</style>
</head>
<body>
  <div id="status">Wczytywanie makiety…</div>
  <iframe class="frame"
    src="../simframe/mockups/Suno-next-73.html?desktop=1&amp;app=none&amp;showcase=1&amp;zoom=0.7950"
    title="SunoOS mockup preview"></iframe>
  <script>
    (function () {
      var frame = document.querySelector('.frame'), status = document.getElementById('status');
      function fail(html) { status.className = 'err'; status.innerHTML = html; }
      frame.addEventListener('load', function () {
        var doc;
        try { doc = frame.contentDocument; } catch (e) { }
        if (!doc || !doc.querySelector('body[data-mode], .review')) {
          fail('Makieta nie wczytała się w ramce. Odśwież z pominięciem cache (Ctrl+Shift+R).');
          return;
        }
        var problems = [];
        try {
          frame.contentWindow.onerror = function (msg, src, line, col) {
            problems.push(msg + ' @ ' + String(src).split('/').pop() + ':' + line);
          };
          frame.contentWindow.addEventListener('unhandledrejection', function (e) {
            var r = e.reason; problems.push('Promise: ' + (r && r.message ? r.message : r));
          });
        } catch (e) { }
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          if (doc.documentElement.dataset.ready === '1') { status.remove(); clearInterval(timer); return; }
          if (tries > 16) {
            clearInterval(timer);
            var det = problems.length ? 'Błędy: ' + problems.slice(0, 3).join(' · ') : 'Brak zgłoszonych błędów JS.';
            fail('Powłoka nie dorysowała się w 8 s. ' + det +
                 ' <br><a href="../simframe/mockups/Suno-next-73.html?desktop=1&app=none&showcase=1&zoom=0.7950" target="_blank">Otwórz makietę bezpośrednio (bez ramki)</a> — jeśli i tam jest czerń, otwórz konsolę (F12) i prześlij pierwszy czerwony błąd.');
          }
        }, 500);
      });
    })();
  </script>
  <p class="fallback">
    Podgląd nie działa? Najpewniej GitHub Pages jeszcze nie jest włączony
    (Settings → Pages → Branch: <code>main</code>, folder: <code>/ (root)</code>).
    Żywy upstream (nieoczyszczony Luma): <a href="https://simplyluma.com/simframe/mockups/luma-next-73.html?desktop=1&amp;app=none&amp;showcase=1&amp;zoom=0.7950">simplyluma.com/simframe</a>.
    Lokalnie: <code>python3 -m http.server -d .</code> i otwórz <code>/preview/</code>.
  </p>
</body>
</html>
