name: Vendor upstream mockup

# Ręcznie, na żądanie: from-scratch pobranie simplyluma.com/simframe,
# filtr nieaktywnych aplikacji (tools/luma_policy.py) i podział na sekcje
# (tools/split_sections.py). Automatyczny trigger wyłączono, bo simframe/
# jest już forkiem SunoOS — ręczne edycje w sekcjach byłyby nadpisywane.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-upstream
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream simframe files
        run: python3 tools/fetch_upstream.py

      - name: Commit vendored files
        run: |
          git config user.name "KimoSterz"
          git config user.email "KimoSterz@users.noreply.github.com"
          git add simframe
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Vendor upstream simframe mockup from simplyluma.com"
            git push
          fi
